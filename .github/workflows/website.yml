name: Public website
on:
  push:
    paths: ['website/**', '.github/workflows/website.yml']
  pull_request:
    paths: ['website/**', '.github/workflows/website.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: npm
      - run: npm ci
      - run: node website/build.mjs
      - run: node --test website/tests/*.test.mjs
      - run: npx playwright install --with-deps chromium --only-shell
      - run: npx playwright test --config website/playwright.config.ts
